name: run-collect
on:
  push:
    paths: [".collect-trigger", ".weekly-trigger"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ceda17b9-bankradar
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if git show --name-only --format= HEAD | grep -qx '.weekly-trigger'; then
            echo "mode=weekly"
            node tools/sync-weekly.mjs --limit=150 --verbose 2>&1 | tee collect.log
          else
            echo "mode=daily"
            node tools/collect.mjs --limit=120 --verbose 2>&1 | tee collect.log
          fi
      - name: Show source summary
        if: always()
        run: |
          echo '```'
          grep -E "^\[(collect|verbose|weekly-sync)\]" collect.log | head -100 || true
          echo '```'
      - name: Commit data
        if: always()
        run: |
          set -o pipefail
          git config user.name 'data-bot'
          git config user.email 'data-bot@users.noreply.github.com'
          git add -A data/ || true
          git diff --cached --stat | tail -20 || true
          git commit -m "chore(data): pipeline run [skip ci]" || echo 'no data change'
          git pull --rebase origin arena/ceda17b9-bankradar || true
          git push origin HEAD:arena/ceda17b9-bankradar || echo 'push failed'
