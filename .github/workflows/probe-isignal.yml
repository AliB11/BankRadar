name: probe-isignal
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch isignal pages
        run: |
          mkdir -p out
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          i=0
          for u in \
            "https://isignal.ir/fund/" \
            "https://isignal.ir/fund/?page=2" \
            "https://isignal.ir/fund/page/2" \
            "https://isignal.ir/fund/?paged=2" \
            "https://isignal.ir/fund/?type=30" \
            "https://isignal.ir/fund/page/60/" \
            "https://isignal.ir/fund/%D8%AB%D8%A8%D8%A7%D8%AA-%D9%86%D9%88%DB%8C%D8%AF/" ; do
            i=$((i+1))
            code=$(curl -sSL --http1.1 -m 40 -A "$UA" -o "out/p$i.html" -w '%{http_code}' "$u" || echo ERR)
            echo "$i $code $(wc -c < "out/p$i.html") $u" | tee -a out/index.txt
          done
          echo '---- links ----' > out/links.txt
          grep -oE 'href="[^"]+"' out/p1.html | sort -u | grep -iE 'fund|page|type|compare' >> out/links.txt || true
          echo '---- numbers/pagination markup ----' > out/pagination.txt
          grep -oE '<[^>]*(page|pagination|nav-links|compare)[^>]*>' out/p1.html | head -60 >> out/pagination.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: isignal-probe
          path: out
          retention-days: 2
