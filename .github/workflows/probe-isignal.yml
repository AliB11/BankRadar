name: probe-isignal
on:
  push:
    paths: [".probe-trigger"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ceda17b9-bankradar
      - name: Probe isignal endpoints
        continue-on-error: true
        run: |
          mkdir -p .probe/api
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          S='https://isignal.ir'
          call() {
            name="$1"; shift
            code=$(curl -sS --http1.1 -m 40 -A "$UA" -H 'origin: https://isignal.ir' -o ".probe/api/$name.out" -w '%{http_code}' "$@" 2>".probe/api/$name.err") || code="000"
            echo "== $name -> $code bytes=$(wc -c < ".probe/api/$name.out" 2>/dev/null || echo 0)" >> .probe/api/summary.txt
            head -c 600 ".probe/api/$name.out" >> .probe/api/summary.txt; echo >> .probe/api/summary.txt
            head -c 300 ".probe/api/$name.err" >> .probe/api/summary.txt; echo >> .probe/api/summary.txt
          }
          echo '--- dns/routes ---' > .probe/api/summary.txt
          getent hosts advancedchart.isignal.ir >> .probe/api/summary.txt 2>&1 || true
          call wpjson "$S/wp-json/"
          call types "$S/wp-json/wp/v2/types"
          call fund3 "$S/wp-json/wp/v2/fund?per_page=3&_fields=symbolId,link,title,date"
          call fundmeta "$S/wp-json/wp/v2/fund?per_page=1"
          call posts "$S/wp-json/wp/v2/posts?per_page=1&_fields=id,link"
          call jina "https://r.jina.ai/https://isignal.ir/fund/"
          call apihost "https://advancedchart.isignal.ir/"
          call apiping "https://advancedchart.isignal.ir/service/signalData@4.0.0/list"
          node -e "
            const fs=require('fs');
            try { const j=JSON.parse(fs.readFileSync('.probe/api/wpjson.out','utf8'));
              const out=[];
              for (const [route,info] of Object.entries(j.routes||{})) if(/fund|signal|table|isignal|chart/i.test(route)) out.push(route+' '+JSON.stringify(info.methods));
              console.log('ROUTES-FILTERED:'); console.log(out.join('\n'));
            } catch(e){ console.log('wpjson parse fail', e.message); }
            try { const t=JSON.parse(fs.readFileSync('.probe/api/types.out','utf8'));
              console.log('TYPES:', Object.keys(t).join(','));
              for (const [k,v] of Object.entries(t)) console.log(k, v.rest_base, JSON.stringify(v.supports||{}).slice(0,120));
            } catch(e){ console.log('types parse fail', e.message); }
            try { const f=JSON.parse(fs.readFileSync('.probe/api/fund3.out','utf8'));
              console.log('FUND3 len', Array.isArray(f)&&f.length, JSON.stringify(f).slice(0,800));
            } catch(e){ console.log('fund3 fail', e.message); }
          " >> .probe/api/summary.txt 2>&1
          ls -la .probe/api
      - name: Commit probe output
        if: always()
        run: |
          git config user.name 'probe-bot'
          git config user.email 'probe-bot@users.noreply.github.com'
          git add -f .probe
          git commit -m "chore(probe): isignal html dump [skip ci]"
          git push origin HEAD:arena/ceda17b9-bankradar
