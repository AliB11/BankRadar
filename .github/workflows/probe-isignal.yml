name: probe-isignal
on:
  push:
    paths: [".probe-trigger"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ceda17b9-bankradar
      - name: Probe spg detail fields
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p .probe/api5
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          B='https://signalpardazgroup.com/service/signalData@4.0.0'
          call() {
            name="$1"; shift
            code=$(curl -sS --http1.1 -m 30 -A "$UA" -H 'origin: https://isignal.ir' -H 'gateway-system: signal' -o ".probe/api5/$name.out" -w '%{http_code}' "$@" 2>".probe/api5/$name.err") || code="000"
            echo "== $name -> $code bytes=$(wc -c < ".probe/api5/$name.out" 2>/dev/null || echo 0) err=$(head -c 120 ".probe/api5/$name.err" 2>/dev/null | tr '\n' ' ')" >> .probe/api5/summary.txt
            { head -c 700 ".probe/api5/$name.out" 2>/dev/null || true; } >> .probe/api5/summary.txt; echo >> .probe/api5/summary.txt
          }
          : > .probe/api5/summary.txt
          OLD='{"market":"fund","sortBy":{"key":"return.oneYear","order":"desc"},"selectProperties":{"properties":["id","name","date","return.oneYear","return.oneMonth","buyPrice","manager","typeId"]}}'
          EXTRA='{"market":"fund","sortBy":{"sortBy":"return.oneYear","desc":true},"property":["id","name","date","return.oneYear","return.sixMonth","return.threeMonth","return.oneMonth","return.oneWeek","buyPrice","sellPrice","manager","rasamUrl","typeId","guarantor","liquidityGuarantor","website","site","startDate","started","nav","navBillionRial","navB"]}'
          call old -X POST "$B/list" -H 'content-type: application/json' --data-binary "$OLD"
          call extra -X POST "$B/list" -H 'content-type: application/json' --data-binary "$EXTRA"
          call info-5247 "$B/info?market=fund&symbolId=5247"
          call info-5061 "$B/info?market=fund&symbolId=5061"
          call types "$B/fundTypes?market=fund"
          node -e "
            const fs=require('fs');
            const rd=n=>{try{return JSON.parse(fs.readFileSync('.probe/api5/'+n+'.out','utf8'))}catch(e){return null}};
            const o=rd('old'); console.log('old envelope', o&&Object.keys(o), o&&o.data&&o.data.totalLength);
            const rows=o&&o.data&&o.data.data||[]; const r5=rows.find(r=>r.id===5247); console.log('old 5247', JSON.stringify(r5));
            const e=rd('extra'); const er=e&&e.data&&e.data.data||[]; const e5=er.find(r=>r.id===5247); console.log('extra 5247 keys', e5&&Object.keys(e5).join(',')); console.log('extra 5247', JSON.stringify(e5).slice(0,900));
            for (const n of ['info-5247','info-5061','types']) { const j=rd(n); console.log('##',n, j&&JSON.stringify(j).slice(0,1200)); }
          " >> .probe/api5/summary.txt 2>&1
      - name: Commit probe output
        if: always()
        run: |
          git config user.name 'probe-bot'
          git config user.email 'probe-bot@users.noreply.github.com'
          git add -f .probe
          git commit -m "chore(probe): isignal html dump [skip ci]"
          git push origin HEAD:arena/ceda17b9-bankradar
