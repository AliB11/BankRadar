name: probe-isignal
on:
  push:
    paths: [".probe-trigger"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ceda17b9-bankradar
      - name: Probe isignal proxies and theme js
        continue-on-error: true
        run: |
          mkdir -p .probe/api3
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          S='https://isignal.ir'
          call() {
            name="$1"; shift
            code=$(curl -sS --http1.1 -m 40 -A "$UA" -H 'origin: https://isignal.ir' -o ".probe/api3/$name.out" -w '%{http_code}' "$@" 2>".probe/api3/$name.err") || code="000"
            echo "== $name -> $code bytes=$(wc -c < ".probe/api3/$name.out" 2>/dev/null || echo 0)" >> .probe/api3/summary.txt
            head -c 400 ".probe/api3/$name.out" >> .probe/api3/summary.txt; echo >> .probe/api3/summary.txt
          }
          : > .probe/api3/summary.txt
          # همهٔ اسکریپت‌های تم
          grep -oE 'https://isignal\.ir/wp-content/themes/signal/[^"]+\.js[^"]*' .probe/p1.html | sort -u > .probe/api3/jsurls.txt || true
          echo "js count: $(wc -l < .probe/api3/jsurls.txt)" >> .probe/api3/summary.txt
          i=0
          while read -r u; do
            i=$((i+1)); curl -sSL --http1.1 -m 40 -A "$UA" -o ".probe/api3/theme-$i.js" "$u" || true
          done < .probe/api3/jsurls.txt
          cat .probe/api3/theme-*.js > .probe/api3/theme-all.js 2>/dev/null || true
          echo "theme bytes: $(wc -c < .probe/api3/theme-all.js)" >> .probe/api3/summary.txt
          for kw in 'signal-data' 'signal/v2/data' 'signal/v4/data' 'advancedchart' 'signalData' 'wp-json/signal'; do
            echo "--- $kw: $(grep -c "$kw" .probe/api3/theme-all.js || true)" >> .probe/api3/summary.txt
            grep -oE ".{120}$kw.{160}" .probe/api3/theme-all.js | head -3 >> .probe/api3/summary.txt || true
          done
          # نمونه‌های ساختار data/fund و تلاش برای پراکسی
          call datafund -X POST "$S/wp-json/signal/v4/data/fund" -H 'content-type: application/json' --data-binary '{"per_page":2}'
          call sd-post2 -X POST "$S/wp-json/signal/v4/signal-data" -H 'content-type: application/json' --data-binary '{"config":{"market":"fund"}}'
          call sd-post3 -X POST "$S/wp-json/signal/v4/signal-data" -H 'content-type: application/json' --data-binary '{"market":"fund","path":"list","service":"signalData@4.0.0"}'
          call sd-post4 -X POST "$S/wp-json/signal/v4/signal-data" -H 'content-type: application/json' --data-binary '{"service":"signalData@4.0.0","method":"list","body":{"market":"fund"}}'
          call cfg1 "$S/wp-json/signal/v2/data/%7B%22market%22%3A%22fund%22%7D"
          call cfg2 "$S/wp-json/signal/v2/data/fund"
          call charts "$S/wp-json/signal/v4/markets/links/fund"
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('.probe/api3/datafund.out','utf8'));
            console.log('datafund len', j.length);
            if (Array.isArray(j) && j[0]) console.log('keys', Object.keys(j[0]).join(','));
            console.log(JSON.stringify(j[0]||{}).slice(0,900));
          " >> .probe/api3/summary.txt 2>&1
          ls -la .probe/api3 | head -20
      - name: Commit probe output
        if: always()
        run: |
          git config user.name 'probe-bot'
          git config user.email 'probe-bot@users.noreply.github.com'
          git add -f .probe
          git commit -m "chore(probe): isignal html dump [skip ci]"
          git push origin HEAD:arena/ceda17b9-bankradar
