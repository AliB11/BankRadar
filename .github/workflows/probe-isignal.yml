name: probe-isignal
on:
  push:
    paths: [".probe-trigger"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ceda17b9-bankradar
      - name: Probe api reachability and proxies
        continue-on-error: true
        run: |
          mkdir -p .probe/api4
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          PAYLOAD='{"market":"fund","sortBy":{"sortBy":"return.oneYear","desc":true},"property":["id","name","date","return.oneYear","return.oneMonth","buyPrice","manager","typeId"]}'
          call() {
            name="$1"; shift
            code=$(curl -sS --http1.1 -m 20 -A "$UA" -H 'origin: https://isignal.ir' -o ".probe/api4/$name.out" -w '%{http_code}' "$@" 2>".probe/api4/$name.err") || code="000"
            echo "== $name -> $code bytes=$(wc -c < ".probe/api4/$name.out" 2>/dev/null || echo 0) err=$(head -c 120 ".probe/api4/$name.err" 2>/dev/null | tr '\n' ' ')" >> .probe/api4/summary.txt
            { head -c 300 ".probe/api4/$name.out" 2>/dev/null || true; } >> .probe/api4/summary.txt; echo >> .probe/api4/summary.txt
          }
          : > .probe/api4/summary.txt
          ENC=$(node -e "console.log(encodeURIComponent('https://advancedchart.isignal.ir/service/signalData@4.0.0/list'))")
          call direct-get -H 'gateway-system: signal' "https://advancedchart.isignal.ir/service/signalData@4.0.0/list?market=fund"
          call direct-http -H 'gateway-system: signal' "http://advancedchart.isignal.ir/service/signalData@4.0.0/list?market=fund"
          call same-origin -H 'gateway-system: signal' "https://isignal.ir/service/signalData@4.0.0/list?market=fund"
          call spg-get -H 'gateway-system: signal' "https://signalpardazgroup.com/service/signalData@4.0.0/list?market=fund"
          call spg-post -X POST "https://signalpardazgroup.com/service/signalData@4.0.0/list" -H 'content-type: application/json' -H 'gateway-system: signal' --data-binary "$PAYLOAD"
          call allorigins "https://api.allorigins.win/raw?url=$ENC"
          call allorigins2 "https://api.allorigins.win/get?url=$ENC"
          call jina-api "https://r.jina.ai/https://advancedchart.isignal.ir/service/signalData@4.0.0/list?market=fund"
          call corsproxy -X POST "https://corsproxy.io/?url=$ENC" -H 'content-type: application/json' --data-binary "$PAYLOAD"
          call corsanywhere -X POST "https://cors-anywhere.herokuapp.com/https://advancedchart.isignal.ir/service/signalData@4.0.0/list" -H 'content-type: application/json' --data-binary "$PAYLOAD"
          call thingproxy -X POST "https://thingproxy.freeboard.io/fetch/https://advancedchart.isignal.ir/service/signalData@4.0.0/list" -H 'content-type: application/json' --data-binary "$PAYLOAD"
          call codetabs "https://api.codetabs.com/v1/proxy?quest=$ENC"
          node -e "
            const fs=require('fs');
            for (const n of ['direct-get','same-origin','spg-get','spg-post','allorigins','allorigins2','jina-api','corsproxy','corsanywhere','thingproxy','codetabs']) {
              try { const t=fs.readFileSync('.probe/api4/'+n+'.out','utf8'); console.log(n,'len',t.length,'head',JSON.stringify(t.slice(0,160))); } catch(e){ console.log(n,'missing'); }
            }
          " >> .probe/api4/summary.txt 2>&1
      - name: Commit probe output
        if: always()
        run: |
          git config user.name 'probe-bot'
          git config user.email 'probe-bot@users.noreply.github.com'
          git add -f .probe
          git commit -m "chore(probe): isignal html dump [skip ci]"
          git push origin HEAD:arena/ceda17b9-bankradar
